<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta charset="utf-8">
<title>曙光冒險 PC 試玩版</title>
<meta name="description" content="電腦橫向遊玩的像素風異世界冒險 RPG。">
<meta name="theme-color" content="#0b0d16">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
/* PC 版：整個視窗放一個 16:9 的遊戲畫面（不再有手機外殼和觸控按鍵） */
:root{ color-scheme: dark; --bg:#07080d; --ink:#eef1f8; --muted:#7c84a3; }
html{height:100%;box-sizing:border-box;background:var(--bg)}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;-webkit-user-select:none;user-select:none}
#app{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
#shell,#bezel{display:contents}
#bezelTop,#pad{display:none !important}
#screenWrap{position:relative;width:100%;flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
#screen{display:block;background:#000;image-rendering:auto;box-shadow:0 0 0 1px #1a1e2e,0 18px 50px rgba(0,0,0,.55)}
#keys{margin:0 0 6px;font-size:12px;color:var(--muted);letter-spacing:.04em;text-align:center}
#keys b{color:#c9cfe6;font-weight:700}
#nameBox{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.6)}
#nameBox[hidden]{display:none}
#nameForm{background:#141828;border:1px solid #3a4266;border-radius:6px;padding:20px 24px;display:flex;flex-direction:column;gap:12px;align-items:center;min-width:300px}
#nameForm label{font-size:15px}
#nameField{font:inherit;font-size:20px;text-align:center;padding:6px 10px;width:220px;background:#0a0c16;color:#fff;border:1px solid #4a5280;border-radius:4px}
#nameForm .row{display:flex;gap:10px}
#nameForm button{font:inherit;font-size:15px;padding:6px 18px;background:#232a46;color:#fff;border:1px solid #4a5280;border-radius:4px;cursor:pointer}
[hidden]{display:none !important}
</style>
<main id="app">
  <div id="shell">
    <div id="bezel">
      <div id="bezelTop"><span class="led"></span><span>BATTERY</span><span class="brand">DAWNLIGHT</span></div>
      <div id="screenWrap"><canvas id="screen" width="480" height="270" aria-label="遊戲畫面"></canvas></div>
    </div>
    <div id="pad">
      <div id="dpad" role="group" aria-label="方向鍵"><span class="zone"></span><span class="hub"></span><span class="arr u"></span><span class="arr d"></span><span class="arr l"></span><span class="arr r"></span></div>
      <div id="mid"><button type="button" data-k="select" aria-label="SELECT">SELECT</button><button type="button" data-k="start" aria-label="START 選單">START</button></div>
      <div id="ab"><button type="button" class="round" data-k="b" aria-label="B 取消／跑步">B</button><button type="button" class="round" data-k="a" aria-label="A 確認">A</button></div>
    </div>
  </div>
  <p id="keys"><b>WASD</b>／<b>方向鍵</b> 移動　<b>Shift</b> 跑步　<b>空白鍵</b>／<b>Z</b> 調查・決定　<b>Esc</b>／<b>X</b> 取消　<b>Enter</b> 選單</p>
  <div id="nameBox" hidden><form id="nameForm" autocomplete="off"><label for="nameField">輸入你的名字（最多 6 個字）</label><input id="nameField" maxlength="6" enterkeyhint="done"><div class="row"><button type="button" id="nameCancel">返回</button><button type="submit">決定</button></div></form></div>
</main>
