<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'></head><body><title>曙光冒險</title>
<meta name="description" content="手機直式遊玩的像素風異世界冒險 RPG。">
<meta name="theme-color" content="#0b0d16">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: dark;
  --bg:#0b0d16; --bg-dot:#141830;
  --shell:#161a2a; --shell-hi:#1d2236; --shell-lo:#121524; --shell-edge:#0a0c14;
  --bezel:#07080f; --bezel-hi:#262d4a;
  --ink:#eef1f8; --muted:#8a93b3; --led:#6ee7d2; --accent:#6ee7d2;
  --dpad:#222840; --dpad-hi:#323a5a; --pill:#1f2438;
  --pix:"Silkscreen", ui-monospace, "Courier New", monospace;
}
html,body{height:100%}
body{margin:0;background:var(--bg);background-image:radial-gradient(var(--bg-dot) 1px,transparent 1px);background-size:6px 6px;color:var(--ink);
  font-family:var(--pix);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
#app{height:100%;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding-inline:16px;padding-block:6px}
#shell{--padh:178px;width:min(100%,440px,calc((100dvh - var(--padh) - 44px) * 0.6875 + 32px));display:flex;flex-direction:column;align-items:stretch;gap:10px;box-sizing:border-box;
  background:linear-gradient(180deg,var(--shell-hi),var(--shell) 40%,var(--shell-lo));border-radius:20px;padding:10px 10px 14px;
  border:1px solid #262c46;box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 10px 30px rgba(0,0,0,.5)}
#bezel{background:var(--bezel);border-radius:10px;padding:5px 6px 7px;box-shadow:inset 0 0 0 1px var(--bezel-hi)}
#bezelTop{display:flex;align-items:center;gap:8px;font-size:9px;letter-spacing:.14em;color:#5f6789;padding:0 2px 4px}
.led{width:6px;height:6px;border-radius:50%;background:var(--led);box-shadow:0 0 6px var(--led)}
.brand{margin-left:auto}
#screenWrap{width:100%;aspect-ratio:11/16;display:flex;align-items:center;justify-content:center;background:#000;border-radius:3px;overflow:hidden}
#screen{display:block;touch-action:none;background:#000}
#pad{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:4px;touch-action:none;--s:min(33vw,132px);--b:min(15vw,60px);min-height:calc(var(--s) + 4px)}
#dpad{position:relative;width:var(--s);height:var(--s);grid-column:3;grid-row:1;justify-self:end;touch-action:none;cursor:pointer}
#dpad::before,#dpad::after{content:"";position:absolute;background:var(--dpad);border-radius:8px;box-shadow:inset 0 1px 0 var(--dpad-hi),0 3px 0 #06070c}
#dpad::before{left:33%;top:2%;width:34%;height:96%}
#dpad::after{top:33%;left:2%;width:96%;height:34%}
#dpad .arr{position:absolute;z-index:2;width:0;height:0;border:7px solid transparent;opacity:.55;pointer-events:none;transform:translate(-50%,-50%)}
#dpad .u{left:50%;top:14%;border-bottom:9px solid #8a93b3;border-top:0}
#dpad .d{left:50%;top:86%;border-top:9px solid #8a93b3;border-bottom:0}
#dpad .l{top:50%;left:14%;border-right:9px solid #8a93b3;border-left:0}
#dpad .r{top:50%;left:86%;border-left:9px solid #8a93b3;border-right:0}
#dpad[data-dir=up] .u,#dpad[data-dir=down] .d,#dpad[data-dir=left] .l,#dpad[data-dir=right] .r{opacity:1;filter:drop-shadow(0 0 4px var(--accent))}
#dpad[data-dir=up] .u{border-bottom-color:var(--accent)}#dpad[data-dir=down] .d{border-top-color:var(--accent)}#dpad[data-dir=left] .l{border-right-color:var(--accent)}#dpad[data-dir=right] .r{border-left-color:var(--accent)}
#dpad .hub{position:absolute;z-index:1;left:50%;top:50%;width:22%;height:22%;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 40% 35%,#2c3350,#1a1f33)}
#mid{display:flex;flex-direction:column;gap:12px;align-items:center;grid-column:2;grid-row:1;justify-self:center;align-self:end;padding-bottom:2px}
#mid button{font-family:var(--pix);font-size:10px;letter-spacing:.06em;color:var(--muted);background:var(--pill);border:1px solid #2c3352;border-radius:6px;padding:6px 10px;touch-action:none;cursor:pointer}
#mid button.on{transform:translateY(1px);color:var(--accent);border-color:var(--accent)}
#ab{position:relative;width:calc(var(--b) * 2.2);height:calc(var(--b) * 1.9);grid-column:1;grid-row:1;justify-self:start}
#ab .round{position:absolute;width:var(--b);height:var(--b);border-radius:50%;font-family:var(--pix);font-weight:700;font-size:calc(var(--b) * .32);color:var(--muted);
  background:radial-gradient(circle at 40% 30%,#283050,#1a1f33 70%);border:2px solid #343c5e;box-shadow:0 3px 0 #06070c,0 6px 12px rgba(0,0,0,.35);touch-action:none;cursor:pointer}
#ab [data-k=a]{color:var(--accent);border-color:var(--accent);box-shadow:0 3px 0 #06070c,0 0 10px rgba(110,231,210,.18)}
#ab .round.on{transform:translateY(2px);box-shadow:0 1px 0 #06070c;background:#2a3456}
#ab [data-k=a]{right:0;top:0}
#ab [data-k=b]{left:0;bottom:4px}
#keys{margin:0;font-family:system-ui,sans-serif;font-size:12px;color:var(--muted);text-align:center;line-height:1.6;max-width:440px}
#keys b{font-family:var(--pix);color:var(--ink);font-weight:400;background:#1c2136;border-radius:4px;padding:0 5px}
#nameBox{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(5,6,12,.7);z-index:10;padding-inline:16px}
#nameBox[hidden]{display:none}
#nameForm{background:#0e1120;color:var(--ink);border:1px solid #3a4262;border-top:2px solid var(--accent);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:10px;width:min(320px,100%);box-sizing:border-box;font-family:system-ui,sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#nameForm label{font-size:15px;font-weight:600}
#nameField{font-size:20px;padding:8px 10px;border:1px solid #3a4262;border-radius:4px;background:#161a2e;color:var(--ink);-webkit-user-select:text;user-select:text}
#nameField:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#nameForm .row{display:flex;gap:8px;justify-content:flex-end}
#nameForm button{font-size:15px;padding:8px 16px;border-radius:4px;border:1px solid #3a4262;background:#1a1f33;color:var(--ink);cursor:pointer}
#nameForm button[type=submit]{background:var(--accent);border-color:var(--accent);color:#0b0d16;font-weight:600}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (hover:none),(pointer:coarse){ #keys{display:none} }
@media (hover:hover) and (pointer:fine){ #shell{--padh:196px} }
/* short screens: tighten controls */
@media (orientation:portrait) and (max-height:700px){ #pad{--s:min(30vw,112px);--b:min(13.5vw,52px)} #shell{--padh:150px;gap:8px;padding-bottom:10px} #mid{gap:8px} }
/* phone held sideways: controls on both sides of the tall screen */
@media (orientation:landscape) and (pointer:coarse){
  #app{padding-block:4px}
  #shell{width:auto;max-width:100%;height:100%;display:grid;grid-template-columns:auto auto auto;grid-template-rows:1fr auto;align-items:center;justify-content:center;column-gap:18px;row-gap:4px;border-radius:26px;padding:8px 14px}
  #pad{display:contents;--s:min(128px,17vw,40dvh);--b:min(58px,8vw,18dvh)}
  #bezel{grid-column:2;grid-row:1/3;height:calc(100dvh - 34px);display:flex;flex-direction:column;box-sizing:border-box;padding:4px 6px 6px}
  #bezelTop{padding-bottom:2px}
  #screenWrap{height:100%;width:auto;flex:1;min-height:0}
  #dpad{grid-column:3;grid-row:1/3;justify-self:center}
  #ab{grid-column:1;grid-row:1;justify-self:center;align-self:end}
  #mid{grid-column:1;grid-row:2;flex-direction:row;justify-self:center;align-self:start;padding:0}
}
@media (prefers-reduced-motion:reduce){ #ab .round.on,#mid button.on{transform:none} }
</style>
<main id="app">
  <div id="shell">
    <div id="bezel">
      <div id="bezelTop"><span class="led"></span><span>BATTERY</span><span class="brand">DAWNLIGHT</span></div>
      <div id="screenWrap"><canvas id="screen" width="176" height="256" aria-label="遊戲畫面"></canvas></div>
    </div>
    <div id="pad">
      <div id="dpad" role="group" aria-label="方向鍵"><span class="hub"></span><span class="arr u"></span><span class="arr d"></span><span class="arr l"></span><span class="arr r"></span></div>
      <div id="mid"><button type="button" data-k="select" aria-label="SELECT">SELECT</button><button type="button" data-k="start" aria-label="START 選單">START</button></div>
      <div id="ab"><button type="button" class="round" data-k="b" aria-label="B 取消／跑步">B</button><button type="button" class="round" data-k="a" aria-label="A 確認">A</button></div>
    </div>
  </div>
  <p id="keys"><b>↑↓←→</b>/<b>WASD</b> 移動　<b>Z</b> 確認　<b>X</b> 取消・按住跑步　<b>Enter</b> 選單</p>
  <div id="nameBox" hidden><form id="nameForm" autocomplete="off"><label for="nameField">輸入你的名字（最多 6 個字）</label><input id="nameField" maxlength="6" enterkeyhint="done"><div class="row"><button type="button" id="nameCancel">返回</button><button type="submit">決定</button></div></form></div>
</main>

// palette-swapped variants for the forest
function recolorDef(def, f) { const cp = JSON.parse(JSON.stringify(def)); const walk = o => { if (Array.isArray(o)) o.forEach(walk); else if (o && typeof o === 'object') for (const k in o) { if ((k === 'c' || k === 'w2') && typeof o[k] === 'string' && o[k][0] === '#') o[k] = f(o[k]); else walk(o[k]); } }; walk(cp); return cp; }
const hueShift = (dh, ks = 1, kl = 1) => c => { const [h, s, l] = rgb2hsl(...hex2rgb(c)); return hsl2hex(h + dh, s * ks, l * kl); };
ART.thornMush = recolorDef(ART.mush, hueShift(160, 1, 0.95));
ART.nightBird = recolorDef(ART.bird, hueShift(45, 0.7, 0.72));
ART.leafFox = recolorDef(ART.fox, hueShift(85, 0.9, 0.95));
ART.mossGiant = recolorDef(ART.golem, hueShift(75, 1.6, 0.95));
ART.caveBat = recolorDef(ART.bird, hueShift(90, 0.6, 0.55));
ART.mudSlime = recolorDef(ART.slime, hueShift(170, 0.45, 0.8));
ART.crystalPebble = recolorDef(ART.pebble, hueShift(180, 3, 1.1));
ART.crystalGolem = recolorDef(ART.golem, hueShift(190, 3.2, 1.05));

const TP = { // shared tile palette

  d1: '#f0dca8', d2: '#e0c488', d3: '#c8a468', d4: '#a88450',
  w1: '#a8e0ff', w2: '#68b8f8', w3: '#4898e8', w4: '#3070c8',
};
const tileCache = {};
function tileCanvas(key, fn) { if (tileCache[key]) return tileCache[key]; const c = mkCanvas(16, 16); fn(c.getContext('2d')); tileCache[key] = c; return c; }
function px(x, X, Y, col) { x.fillStyle = col; x.fillRect(X, Y, 1, 1); }
function rows(x, R, pal, ox = 0, oy = 0) { for (let y = 0; y < R.length; y++) for (let i = 0; i < R[y].length; i++) { const c = pal[R[y][i]]; if (c) { x.fillStyle = c; x.fillRect(ox + i, oy + y, 1, 1); } } }
const Tiles = {};
Tiles.grass = v => tileCanvas('grass' + v, x => {
  x.fillStyle = TP.g2; x.fillRect(0, 0, 16, 16);
  const r = srand(v * 97 + 5);
  for (let i = 0; i < 3; i++) { const X = 1 + Math.floor(r() * 12), Y = 2 + Math.floor(r() * 12); px(x, X, Y, TP.g3); px(x, X + 2, Y, TP.g3); px(x, X + 1, Y + 1, TP.g3); px(x, X, Y - 1, TP.g1); px(x, X + 2, Y - 1, TP.g1); }
  if (v % 3 === 0) { px(x, 11, 12, TP.g1); px(x, 4, 5, TP.g1); }
});
Tiles.flower = (f, color) => tileCanvas('flower' + f + color, x => {
  x.drawImage(Tiles.grass(1), 0, 0);
  const pal = { o: color === 'y' ? '#f8e050' : '#f86868', i: color === 'y' ? '#f8a030' : '#f8e880', l: '#ffffff', s: color === 'y' ? '#c89020' : '#c03848', g: TP.g4 };
  const A = f ? ['.l.', 'lil', '.l.'] : ['.o.', 'oio', '.s.'];
  const B = f ? ['.o.', 'oio', '.s.'] : ['.l.', 'lil', '.l.'];
  const draw = (R, X, Y) => { rows(x, R.map(r => r.replace(/l/g, 'o')), pal, X, Y); px(x, X + 1, Y + 3, TP.g4); };
  draw(f ? ['.o.', 'oio', '.s.'] : ['...', '.o.', 'oio'], 2, 2); draw(f ? ['...', '.o.', 'oio'] : ['.o.', 'oio', '.s.'], 10, 9);
  draw(['.o.', 'oio', '.s.'], 9, 1); draw(['.o.', 'oio', '.s.'], 3, 10);
});

Tiles.path = (mask) => tileCanvas('path' + mask, x => {
  x.fillStyle = TP.d2; x.fillRect(0, 0, 16, 16);
  const r = srand(31); for (let i = 0; i < 7; i++) { px(x, Math.floor(r() * 16), Math.floor(r() * 16), TP.d3); px(x, Math.floor(r() * 16), Math.floor(r() * 16), TP.d1); }
  // edges: mask bits 1=N,2=E,4=S,8=W (neighbor is not path)
  const edge = (pts) => { for (const [X, Y, c] of pts) px(x, X, Y, c); };
  for (let i = 0; i < 16; i++) {
    const j = (i * 7) % 3;
    if (mask & 1) { for (let k = 0; k <= (j === 0 ? 1 : 0); k++) px(x, i, k, TP.g2); px(x, i, j === 0 ? 2 : 1, TP.d3); }
    if (mask & 4) { for (let k = 0; k <= (j === 1 ? 1 : 0); k++) px(x, i, 15 - k, TP.g2); px(x, i, j === 1 ? 13 : 14, TP.d1); }
    if (mask & 8) { for (let k = 0; k <= (j === 2 ? 1 : 0); k++) px(x, k, i, TP.g2); px(x, j === 2 ? 2 : 1, i, TP.d3); }
    if (mask & 2) { for (let k = 0; k <= (j === 0 ? 1 : 0); k++) px(x, 15 - k, i, TP.g2); px(x, j === 0 ? 13 : 14, i, TP.d1); }

function variantRows(style) {
  const R = { down: VILLAGER_ROWS.down.slice(), up: VILLAGER_ROWS.up.slice(), left: VILLAGER_ROWS.left.slice() };
  const set = (d, i, s) => { R[d][i] = s; };
  // remove sword on back for NPCs
  R.up = R.up.map(r => r.replace(/G/g, 'R').replace(/g/g, 'r')); R.down = R.down.map(r => r.replace(/G/g, 'B'));
  R.left = R.left.map(r => r.replace(/G/g, 'B'));
  if (style === 'long') {
    set('down', 10, '.kHSSkSSSSkSSHk.'); set('down', 11, '.kHSSkSSSSkSSHk.'); set('down', 12, '.kHksSSSSSSskHk.'); set('down', 13, '.kHkYYYYYYYYkHk.'); set('down', 14, '.kHkRyYYYYyRkHk.'); set('down', 15, '..kkRRRyyRRRkk..');
    set('up', 11, '.kHHHHHHHHHHHHk.'); set('up', 12, '.kHHHhHHHHhHHHk.'); set('up', 13, '.kHHHHHHHHHHHHk.'); set('up', 14, '.kSkHHHHHHHHkSk.'); set('up', 15, '.kSkRkHHHHkRkSk.');
    set('left', 11, '.kSkSSSSsHHHHk..'); set('left', 12, '..kSSSSskHHHHk..'); set('left', 13, '...kkYYYYHHHk...'); set('left', 14, '...kSRRYYHHk....');
  }
  if (style === 'beard') {
    set('down', 12, '...kWWWWWWWWk...'); set('down', 13, '..kkWWWWWWWWkk..'); set('down', 14, '.kSkRWWWWWWRkSk.'); set('down', 15, '.kSkRRWWWWRRkSk.');
    set('left', 12, '..kWWWWskHkk....'); set('left', 13, '...kWWWWyk......'); set('left', 14, '...kSWWYYyykk...');
  }
  if (style === 'bald') {
    for (const d of ['down', 'up', 'left']) for (let i = 1; i <= 5; i++) R[d][i] = R[d][i].replace(/[Hhj]/g, (m, o) => (o > 4 && o < 11 && i < 5) ? 'S' : m);
    set('down', 12, '...kWWWWWWWWk...'); set('down', 13, '..kkWWWWWWWWkk..'); set('down', 14, '.kSkRWWWWWWRkSk.');
    set('left', 12, '..kWWWWskHkk....'); set('left', 13, '...kWWWWyk......');
  }
  if (style === 'helmet') {
    set('down', 7, '.kHHHHHHHHHHHHk.'); set('down', 8, '.kkkSSSSSSSSkkk.');
    set('left', 7, '.kHHHHHHHHHHHHk.'); set('left', 8, '.kSSSkHHHHHHHk..');
  }
  return R;
}
function buildCharFrames(RW, pal, skirt) {
  const legs = skirt ? {
    stand: ['...kPPPPPPPPk...', '...kPPPPPPPPk...', '....kSkkkkSk....', '....kBk..kBk....'],
    stepL: ['...kPPPPPPPPk...', '...kPPPPPPPPk...', '....kSkkkkSk....', '....kBk..kBk....', '.........kk.....'],
    stepR: ['...kPPPPPPPPk...', '...kPPPPPPPPk...', '....kSkkkkSk....', '....kBk..kBk....', '....kk..........'],
    sideStand: ['...kPPPPPPk.....', '...kPPPPPPk.....', '....kSkSk.......', '....kBkBk.......'],
    sideStepA: ['...kPPPPPPk.....', '...kPPPPPPk.....', '...kSk.kSk......', '...kBk..kBk.....', '.........kk.....'],
    sideStepB: ['...kPPPPPPk.....', '...kPPPPPPk.....', '.....kSSk.......', '.....kBBk.......', '.....kkkk.......'],
  } : LEGS;
  const build = (dir, lg, bob) => { const body = RW[dir]; const L = legs[lg]; const out = new Array(22).fill('................'); const off = bob ? -1 : 0; for (let i = 0; i < body.length; i++) if (i + off >= 0) out[i + off] = body[i]; const ls = 18 + off; for (let i = 0; i < L.length; i++) if (ls + i < 22) out[ls + i] = L[i]; return spriteFrom(out, pal); };
  const f = {};
  for (const d of ['down', 'up']) f[d] = [build(d, 'stand', 0), build(d, 'stepL', 1), build(d, 'stand', 0), build(d, 'stepR', 1)];
  f.left = [build('left', 'sideStand', 0), build('left', 'sideStepA', 1), build('left', 'sideStand', 0), build('left', 'sideStepB', 1)];
  f.right = f.left.map(flipCanvas); return f;
}

/* ---------- Quest markers on the map ---------- */
function questMarks(st = Game.st) {
  const f = st.flags, M = [];
  if (!f.license) M.push(['town', 15, 6]); else if (!f.golem) M.push(['ruins', 7, 3]);
  if (f.q1 && !f.q1res) M.push(['route', 3, 31]); if (f.q1res && !f.q1done) M.push(['town', 16, 16]);
  if (f.q2 && !f.q2res) M.push(['forest', 3, 15]); if (f.q2res === 'stay' && !f.q2done) M.push(['forest', f.mossGiant ? 3 : 4, f.mossGiant ? 15 : 17]); if (f.q2res === 'home' && !f.q2done) M.push(['route', 12, 2]);
  if (f.q3 === 1) M.push(st.bag.crystal >= 3 ? ['town', 13, 16] : ['sewer', 4, 6]);
  if (f.caravanMet && !f.caravan) M.push(['route', 12, 22]);
  if (f.mineOpen && !f.bandit) M.push(['mine', 9, 2]);
  if (f.golem && !f.boneKnight) M.push(st.map === 'catacomb' ? ['catacomb', 9, 3] : ['ruins', 13, 10]);
  const c4 = comState('c4', st); if (c4 && c4.s === 'on' && !st.bag.pocketWatch) M.push(['forest', 19, 9]);
  if (Object.keys(COMMISSIONS).some(k => { const s = comState(k, st); return s && s.s === 'on' && comProgress(k, st).ready; })) M.push(['town', 12, 8]);
  return M;
}

class TextBox {

  }

    else { this.state = this.keep ? 'done' : 'end'; if (this.keep) this.done = true; }
  }
  update() {
    this.t++;

      this.acc = (this.acc || 0) + this.speed();
      const L = [...this.lines[this.li]].length;
      while (this.acc >= 1 && this.ci < L) { this.ci++; this.acc -= 1; }
      if (this.ci >= L) { this.acc = 0; this.finishLine(); }
      Input.consume('a');
    } else if (this.state === 'wait') {
      if (this.auto && ++this.hold > 50) { this.hold = 0; this.state = 'scroll'; this.scroll = 0; }
      if (Input.pressed('a') || Input.pressed('b')) { Input.consume('a', 'b'); if (!this.auto) Sound.sfx('cursor'); this.state = 'scroll'; this.scroll = 0; this.hold = 0; }

    } else if (this.state === 'end') {

      else if (Input.pressed('a') || Input.pressed('b')) { Input.consume('a', 'b'); Sound.sfx('cursor'); this.done = true; }
    }

}

const HERO_PK = {
  rune(x, p, a) { const r = p.r * Math.min(1, p.t / 6), rot = p.t * 0.08 * (p.dir || 1), sq = p.sq || 0.38; x.globalAlpha = Math.min(1, a * 1.6); x.strokeStyle = p.c; x.lineWidth = 1.5;
    x.beginPath(); x.ellipse(p.x, p.y, r, r * sq, 0, 0, 7); x.stroke(); x.beginPath(); x.ellipse(p.x, p.y, r * 0.72, r * sq * 0.72, 0, 0, 7); x.stroke();
    x.fillStyle = p.c2; const n = p.n || 8; for (let i = 0; i < n; i++) { const an = rot + i * Math.PI * 2 / n; x.fillRect(Math.round(p.x + Math.cos(an) * r * 0.86) - 1, Math.round(p.y + Math.sin(an) * r * sq * 0.86) - 1, 2, 2); }
    const v = p.poly || 3; x.strokeStyle = p.c2; x.beginPath(); for (let i = 0; i <= v; i++) { const an = -rot + i * Math.PI * 2 / v; const px = p.x + Math.cos(an) * r * 0.7, py = p.y + Math.sin(an) * r * sq * 0.7; if (i) x.lineTo(px, py); else x.moveTo(px, py); } x.stroke(); },
  rays(x, p, a) { x.globalAlpha = a; x.strokeStyle = p.c; x.lineCap = 'round'; for (let i = 0; i < p.n; i++) { const an = p.a0 + i * Math.PI * 2 / p.n, r0 = 6 + p.t * 1.5, r1 = r0 + p.len * a; x.lineWidth = i % 2 ? 1 : 2; x.beginPath(); x.moveTo(p.x + Math.cos(an) * r0, p.y + Math.sin(an) * r0); x.lineTo(p.x + Math.cos(an) * r1, p.y + Math.sin(an) * r1); x.stroke(); } },

function* classTalk() {
  const st = Game.st, C = CLASSES, cur = C[st.cls]; let opts = [];
  if (!st.cls) opts = ['swordsman', 'mage', 'guardian']; // saves from before the opening ceremony
  else if (cur && cur.tier === 1 && st.lv >= 14) opts = Object.keys(C).filter(k => C[k].from === st.cls);
  if (st.flags.hiddenCls && st.cls !== 'otherworlder') opts.push('otherworlder');
  if (!opts.length) return false;
  yield* say(!st.cls ? '你的力量開始覺醒了……要選擇一條道路嗎？' : '你已經走得很遠了。要踏上新的道路嗎？');
  while (true) {
    const r = yield* ask('要選擇哪個職業？', opts.map(k => C[k].n).concat(['再想想']));
    if (r < 0 || r >= opts.length) { yield* say('想好了再來找我吧。'); return true; }
    const k = opts[r]; yield* say(C[k].n + '：' + C[k].d + '\n職業技能「' + MOVES[C[k].move].n + '」' + (C[k].move2 ? '、Lv' + C[k].lv2 + '「' + MOVES[C[k].move2].n + '」' : ''));

const SAVE_KEY = 'dawnlight_save_v2', SET_KEY = 'dawnlight_settings_v1';

function loadGame() { try { const s = localStorage.getItem(SAVE_KEY); return s ? JSON.parse(s) : null; } catch (e) { return null; } }
