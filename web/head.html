<title>曙光冒險</title>
<meta name="description" content="GBA 風格的回合制冒險 RPG：由你親自上場戰鬥。">
<meta name="theme-color" content="#101a17">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: dark;
  --bg:#101a17; --bg-dot:#16241f;
  --shell:#1f5a47; --shell-hi:#2f7c62; --shell-lo:#143b2f; --shell-edge:#0d2921;
  --bezel:#1a1d26; --bezel-hi:#2a2f3c;
  --ink:#e6efe9; --muted:#8fb3a4; --led:#ff5a4a;
  --btn:#e0b65c; --btn-hi:#f4d487; --btn-lo:#a47c2c; --btn-ink:#3b2a0c;
  --dpad:#232830; --dpad-hi:#3a414d; --pill:#1a3a30;
  --pix:"Silkscreen", ui-monospace, "Courier New", monospace;
}
html,body{height:100%}
body{margin:0;background:var(--bg);background-image:radial-gradient(var(--bg-dot) 1px,transparent 1px);background-size:6px 6px;color:var(--ink);
  font-family:var(--pix);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
#app{height:100%;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding-inline:16px;padding-block:8px}
#shell{width:100%;max-width:560px;display:flex;flex-direction:column;align-items:stretch;gap:14px;
  background:linear-gradient(170deg,var(--shell-hi),var(--shell) 30%,var(--shell-lo));border-radius:22px 22px 44px 22px;padding:14px 14px 22px;box-sizing:border-box;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.14),inset 0 -4px 0 var(--shell-edge),0 10px 30px rgba(0,0,0,.45)}
#bezel{background:var(--bezel);border-radius:10px 10px 26px 10px;padding:8px 10px 12px;box-shadow:inset 0 0 0 2px var(--bezel-hi)}
#bezelTop{display:flex;align-items:center;gap:8px;font-size:10px;letter-spacing:.14em;color:#7a8296;padding:0 2px 6px}
.led{width:7px;height:7px;border-radius:50%;background:var(--led);box-shadow:0 0 6px var(--led)}
.brand{margin-left:auto}
#screenWrap{width:100%;aspect-ratio:3/2;display:flex;align-items:center;justify-content:center;background:#000;border-radius:3px;overflow:hidden}
#screen{display:block;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;background:#000}
#pad{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:6px;touch-action:none;--s:min(34vw,136px);--b:min(15.5vw,62px)}
#dpad{position:relative;width:var(--s);height:var(--s);justify-self:start;touch-action:none;cursor:pointer}
#dpad::before,#dpad::after{content:"";position:absolute;background:var(--dpad);border-radius:8px;box-shadow:inset 0 2px 0 var(--dpad-hi),0 3px 0 #0b0d10}
#dpad::before{left:33%;top:2%;width:34%;height:96%}
#dpad::after{top:33%;left:2%;width:96%;height:34%}
#dpad .arr{position:absolute;z-index:2;width:0;height:0;border:7px solid transparent;opacity:.55;pointer-events:none;transform:translate(-50%,-50%)}
#dpad .u{left:50%;top:14%;border-bottom:9px solid #9aa3b5;border-top:0}
#dpad .d{left:50%;top:86%;border-top:9px solid #9aa3b5;border-bottom:0}
#dpad .l{top:50%;left:14%;border-right:9px solid #9aa3b5;border-left:0}
#dpad .r{top:50%;left:86%;border-left:9px solid #9aa3b5;border-right:0}
#dpad[data-dir=up] .u,#dpad[data-dir=down] .d,#dpad[data-dir=left] .l,#dpad[data-dir=right] .r{opacity:1;filter:drop-shadow(0 0 3px #fff)}
#dpad .hub{position:absolute;z-index:1;left:50%;top:50%;width:22%;height:22%;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 40% 35%,#2e343e,#1a1e24)}
#mid{display:flex;flex-direction:column;gap:12px;align-items:center;justify-self:center;align-self:end;padding-bottom:4px}
#mid button{font-family:var(--pix);font-size:10px;letter-spacing:.06em;color:var(--muted);background:var(--pill);border:0;border-radius:20px;padding:6px 10px;box-shadow:inset 0 -2px 0 rgba(0,0,0,.35),0 1px 0 rgba(255,255,255,.08);touch-action:none;cursor:pointer}
#mid button.on{transform:translateY(1px);color:var(--ink)}
#ab{position:relative;width:calc(var(--b) * 2.25);height:calc(var(--b) * 1.9);justify-self:end}
#ab .round{position:absolute;width:var(--b);height:var(--b);border-radius:50%;border:0;font-family:var(--pix);font-weight:700;font-size:calc(var(--b) * .32);color:var(--btn-ink);
  background:radial-gradient(circle at 38% 32%,var(--btn-hi),var(--btn) 55%,var(--btn-lo));box-shadow:0 4px 0 #6f5218,0 6px 12px rgba(0,0,0,.35);touch-action:none;cursor:pointer}
#ab .round.on{transform:translateY(3px);box-shadow:0 1px 0 #6f5218}
#ab [data-k=a]{right:0;top:0}
#ab [data-k=b]{left:0;bottom:4px}
#keys{margin:0;font-family:system-ui,sans-serif;font-size:13px;color:var(--muted);text-align:center;line-height:1.6;max-width:640px}
#keys b{font-family:var(--pix);color:var(--ink);font-weight:400;background:#1c2b26;border-radius:4px;padding:0 5px}
#nameBox{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(6,10,12,.6);z-index:10;padding-inline:16px}
#nameBox[hidden]{display:none}
#nameForm{background:#fcfcf8;color:#303038;border:4px solid #5888c8;outline:2px solid #384868;border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:10px;width:min(320px,100%);box-sizing:border-box;font-family:system-ui,sans-serif}
#nameForm label{font-size:15px;font-weight:600}
#nameField{font-size:20px;padding:8px 10px;border:2px solid #384868;border-radius:4px;background:#fff;color:#222;-webkit-user-select:text;user-select:text}
#nameField:focus-visible{outline:3px solid #f0b030}
#nameForm .row{display:flex;gap:8px;justify-content:flex-end}
#nameForm button{font-size:15px;padding:8px 16px;border-radius:4px;border:2px solid #384868;background:#e8eef8;color:#223;cursor:pointer}
#nameForm button[type=submit]{background:#5888c8;color:#fff}
button:focus-visible{outline:3px solid #f0b030;outline-offset:2px}
/* desktop: keyboard first */
@media (hover:hover) and (pointer:fine){
  #shell{max-width:min(1000px,calc((100dvh - 110px) * 1.5 + 48px))}
  #pad{display:none}
}
@media (hover:none),(pointer:coarse){ #keys{display:none} }
/* phone landscape */
@media (orientation:landscape) and (pointer:coarse){
  #app{padding-block:4px}
  #shell{max-width:none;height:100%;display:grid;grid-template-columns:1fr auto 1fr;grid-template-rows:1fr auto;align-items:center;column-gap:10px;row-gap:4px;border-radius:26px;padding:8px 10px}
  #pad{display:contents;--s:min(128px,15vw,38dvh);--b:min(58px,7vw,17dvh)}
  #bezel{grid-column:2;grid-row:1/3;height:min(calc(100dvh - 34px),calc((100vw - 2 * min(128px,15vw,38dvh) - 110px) / 1.5 + 28px));display:flex;flex-direction:column;box-sizing:border-box;padding:4px 8px 8px}
  #bezelTop{padding-bottom:3px}
  #screenWrap{height:100%;width:auto;flex:1;min-height:0}
  #dpad{grid-column:1;grid-row:1/3;justify-self:center}
  #ab{grid-column:3;grid-row:1;justify-self:center;align-self:end}
  #mid{grid-column:3;grid-row:2;flex-direction:row;justify-self:center;align-self:start;padding:0}
}
@media (orientation:portrait) and (max-height:700px){ #pad{--s:min(30vw,112px);--b:min(13.5vw,54px)} #shell{gap:8px;padding-bottom:14px} }
@media (prefers-reduced-motion:reduce){ #ab .round.on,#mid button.on{transform:none} }
</style>
<main id="app">
  <div id="shell">
    <div id="bezel">
      <div id="bezelTop"><span class="led"></span><span>BATTERY</span><span class="brand">DAWNLIGHT</span></div>
      <div id="screenWrap"><canvas id="screen" width="240" height="160" aria-label="遊戲畫面"></canvas></div>
    </div>
    <div id="pad">
      <div id="dpad" role="group" aria-label="方向鍵"><span class="hub"></span><span class="arr u"></span><span class="arr d"></span><span class="arr l"></span><span class="arr r"></span></div>
      <div id="mid"><button type="button" data-k="select" aria-label="SELECT">SELECT</button><button type="button" data-k="start" aria-label="START 選單">START</button></div>
      <div id="ab"><button type="button" class="round" data-k="b" aria-label="B 取消／跑步">B</button><button type="button" class="round" data-k="a" aria-label="A 確認">A</button></div>
    </div>
  </div>
  <p id="keys"><b>↑↓←→</b> / <b>WASD</b> 移動　<b>Z</b> 確認（A）　<b>X</b> 取消・按住跑步（B）　<b>Enter</b> 選單（START）</p>
  <div id="nameBox" hidden><form id="nameForm" autocomplete="off"><label for="nameField">輸入你的名字（最多 6 個字）</label><input id="nameField" maxlength="6" enterkeyhint="done"><div class="row"><button type="button" id="nameCancel">返回</button><button type="submit">決定</button></div></form></div>
</main>
